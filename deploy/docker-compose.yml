# Container hosting for PostgreSQL, the API, and the worker.
# The browser app is apps/web and is published on Vercel, not from this file.
# Temporal and etcd are not included. Workflow state and fencing live in PostgreSQL.
# Device secrets are references such as vault://... and are not written into this file.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sdn
      POSTGRES_PASSWORD: sdn
      POSTGRES_DB: sdn
    ports:
      - "5432:5432"
    volumes:
      - sdn-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdn -d sdn"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgres://sdn:sdn@postgres:5432/sdn?sslmode=disable
      HTTP_ADDR: ":8080"
      AUTH_MODE: ${AUTH_MODE:-dev}
      TOKEN_SECRET: ${TOKEN_SECRET:-dev-only-token-secret}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-sdn-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-only-oidc-secret}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      OIDC_REDIRECT_URLS: ${OIDC_REDIRECT_URLS:-http://localhost:5173/callback}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:8080}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      INLINE_WORKFLOWS: ${INLINE_WORKFLOWS:-false}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgres://sdn:sdn@postgres:5432/sdn?sslmode=disable
      AUTH_MODE: ${AUTH_MODE:-dev}
      TOKEN_SECRET: ${TOKEN_SECRET:-dev-only-token-secret}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-dev-only-oidc-secret}
      INLINE_WORKFLOWS: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sdn-pg:
